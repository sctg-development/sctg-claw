[package]
name = "device-flow-validate"
version = "0.1.0"
edition = "2021"
description = "Valide le flux GitHub Device Authorization d'un mobile-auth-broker déployé"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
