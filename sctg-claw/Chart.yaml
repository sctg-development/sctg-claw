apiVersion: v2
name: claw
description: "Helm chart to deploy OpenClaw Gateway with optional mobile authentication broker"
type: application
version: 0.5.4
appVersion: "2026.8.1"

dependencies:
- name: cloudflared
  version: 0.1.3
  repository: https://helm-repo.highcanfly.club
  condition: cloudflared.enabled
- name: oauth2-proxy
  condition: oauth2-proxy.enabled
  version: 6.20.0
  repository: https://oauth2-proxy.github.io/manifests
