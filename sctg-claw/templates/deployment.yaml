apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "claw.fullname" . }}
  labels:
    {{- include "claw.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "claw.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "claw.labels" . | nindent 8 }}
      annotations:
        checksum/openclaw-config: {{ include (print $.Template.BasePath "/openclaw-config.yaml") . | sha256sum }}
        {{- if .Values.openclaw.secret.create }}
        checksum/openclaw-secret: {{ include (print $.Template.BasePath "/openclaw-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ if .Values.serviceAccount.create }}{{ default (include "claw.fullname" .) .Values.serviceAccount.name }}{{ else }}{{ required "serviceAccount.name must be set when serviceAccount.create is false" .Values.serviceAccount.name }}{{ end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: init-workspace
          image: {{ .Values.openclaw.initContainer.image | default "busybox:1.37" }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p {{ $.Values.persistence.mountPath }}/.openclaw/workspace
              # OpenClaw's canonical config lives at <state-dir>/openclaw.json
              # (~/.openclaw/openclaw.json), never at the ConfigMap-mounted
              # {{ $.Values.persistence.mountPath }}/openclaw.json - that path
              # is not one of its resolved config candidates. Seed it here,
              # only when missing: once OpenClaw has written this file, it is
              # the source of truth and survives ConfigMap edits/pod restarts.
              # To pick up a ConfigMap change, delete the persisted copy first:
              #   kubectl exec <pod> -c gateway -- rm /home/node/.openclaw/openclaw.json
              [ -f {{ $.Values.persistence.mountPath }}/.openclaw/openclaw.json ] || cp /openclaw-config/openclaw.json {{ $.Values.persistence.mountPath }}/.openclaw/openclaw.json
              {{- range $filename, $content := .Values.openclaw.workspaceFiles }}
              [ -f {{ $.Values.persistence.mountPath }}/.openclaw/workspace/{{ $filename }} ] || cp /openclaw-config/{{ $filename }} {{ $.Values.persistence.mountPath }}/.openclaw/workspace/{{ $filename }}
              {{- end }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            {{- toYaml .Values.openclaw.initContainer.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            - name: openclaw-config
              mountPath: /openclaw-config
              readOnly: true
      containers:
        - name: gateway
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "'mkdir -p /tmp/openclaw-compile-cache && /usr/local/bin/openclaw gateway stop'"]
          {{- if .Values.openclaw.overrideCommand }}
          command: {{ .Values.openclaw.overrideCommand | toYaml | nindent 10 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: gateway
            - containerPort: {{ .Values.service.sandboxPort }}
              name: mcp-sandbox
            - containerPort: 5900
              name: vnc
          env:
            {{- if .Values.openclaw.vnc.password }}
            - name: VNC_PASSWORD
              value: {{ .Values.openclaw.vnc.password | quote }}
            {{- end }}
            {{- if include "claw.openclawSecretName" . }}
            - name: NODE_COMPILE_CACHE
              value: /tmp/openclaw-compile-cache
            - name: OPENCLAW_DEBUG
              value: "0"
            - name: AGGRESSIVE_ROTATION
              value: {{ .Values.openclaw.aggressiveRotation | quote }}
            {{- if .Values.openclaw.secret.ghToken }}
            - name: GH_TOKEN
              value: {{ .Values.openclaw.secret.ghToken | quote }}  
            {{- end }}
            {{- if .Values.openclaw.secret.garminEmail }}
            - name: GARMIN_EMAIL
              value: {{ .Values.openclaw.secret.garminEmail | quote }}
            {{- end }}
            {{- if .Values.openclaw.secret.garminPassword }}
            - name: GARMIN_PASSWORD
              value: {{ .Values.openclaw.secret.garminPassword | quote }}
            {{- end }}
            {{- end }}
          {{- if include "claw.openclawSecretName" . }}
          envFrom:
            - secretRef:
                name: {{ include "claw.openclawSecretName" . }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: gateway
              scheme: HTTP
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: gateway
              scheme: HTTP
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          {{- end }}
        {{- if .Values.signalCli.enabled }}
        - name: signal-cli
          image: "{{ .Values.signalCli.image.repository }}:{{ .Values.signalCli.image.tag }}"
          env:
            - name: MODE
              value: "json-rpc"
          ports:
            - containerPort: {{ .Values.signalCli.port }}
              name: signal-cli
          resources:
            {{- toYaml .Values.signalCli.resources | nindent 12 }}
          volumeMounts:
            - name: signal-cli-data
              mountPath: /home/.local/share/signal-cli
        {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "claw.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: openclaw-config
          configMap:
            name: {{ include "claw.openclawConfigMapName" . }}
        {{- if .Values.signalCli.enabled }}
        - name: signal-cli-data
          {{- if .Values.signalCli.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "claw.fullname" . }}-signal-cli
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
