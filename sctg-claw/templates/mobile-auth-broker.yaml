{{- /*
Mobile Auth Broker templates - included when mobileAuthBroker.enabled is true
*/ -}}
{{- if .Values.mobileAuthBroker.enabled -}}

{{- /* ConfigMap for allowed emails */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "claw.mobileAuthBrokerAllowedEmailsConfigMapName" . }}
  labels:
    {{- include "claw.labels" . | nindent 4 }}
    app.kubernetes.io/component: mobile-auth-broker
data:
  allowedEmails: {{ .Values.mobileAuthBroker.allowedEmails | join "," | quote }}
---

{{- /* Secret for broker */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "claw.mobileAuthBrokerSecretName" . }}
  labels:
    {{- include "claw.labels" . | nindent 4 }}
    app.kubernetes.io/component: mobile-auth-broker
type: Opaque
{{- if not .Values.mobileAuthBroker.existingSecret }}
stringData:
  serverSecret: {{ .Values.mobileAuthBroker.serverSecret | default (randAlphaNum 64) | quote }}
  githubClientID: {{ .Values.mobileAuthBroker.githubClientID | quote }}
{{- end }}
---

{{- /* PersistentVolumeClaim */ -}}
{{- if .Values.mobileAuthBroker.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "claw.mobileAuthBrokerPVCName" . }}
  labels:
    {{- include "claw.labels" . | nindent 4 }}
    app.kubernetes.io/component: mobile-auth-broker
spec:
  accessModes:
    {{- .Values.mobileAuthBroker.persistence.accessModes | toYaml | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.mobileAuthBroker.persistence.size | quote }}
  {{- if .Values.mobileAuthBroker.persistence.storageClass }}
  storageClassName: {{ .Values.mobileAuthBroker.persistence.storageClass | quote }}
  {{- end }}
---
{{- end }}

{{- /* Deployment */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "claw.fullname" . }}-mobile-auth-broker
  labels:
    {{- include "claw.labels" . | nindent 4 }}
    app.kubernetes.io/component: mobile-auth-broker
  annotations:
    checksum/secret: {{ print .Values.mobileAuthBroker.serverSecret .Values.mobileAuthBroker.githubClientID | sha256sum }}
    checksum/allowed-emails: {{ .Values.mobileAuthBroker.allowedEmails | join "," | sha256sum }}
spec:
  replicas: {{ .Values.mobileAuthBroker.replicaCount | default 1 }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "claw.name" . }}-mobile-auth-broker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "claw.name" . }}-mobile-auth-broker
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/component: mobile-auth-broker
      annotations:
        checksum/secret: {{ print .Values.mobileAuthBroker.serverSecret .Values.mobileAuthBroker.githubClientID | sha256sum }}
        checksum/allowed-emails: {{ .Values.mobileAuthBroker.allowedEmails | join "," | sha256sum }}
    spec:
      serviceAccountName: {{ if .Values.mobileAuthBroker.serviceAccount.create }}{{ default (include "claw.fullname" .) .Values.mobileAuthBroker.serviceAccount.name }}{{ else }}{{ required "mobileAuthBroker.serviceAccount.name must be set when serviceAccount.create is false" .Values.mobileAuthBroker.serviceAccount.name }}{{ end }}
      securityContext:
        {{- toYaml .Values.mobileAuthBroker.podSecurityContext | nindent 8 }}
      {{- with .Values.mobileAuthBroker.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mobileAuthBroker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mobileAuthBroker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mobileAuthBroker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mobile-auth-broker
          image: "{{ .Values.mobileAuthBroker.image.repository }}:{{ .Values.mobileAuthBroker.image.tag }}"
          imagePullPolicy: {{ .Values.mobileAuthBroker.image.pullPolicy | default "IfNotPresent" }}
          {{- if not .Values.mobileAuthBroker.tailnet.enabled }}
          # The image's default entrypoint is cirond, supervising the broker
          # plus tailscaled/tailscale (see scripts/ciron.toml). Without the
          # tailnet bypass there is nothing for cirond to supervise beyond
          # the broker itself, so run it directly instead.
          command: ["/app/mobile-auth-broker"]
          {{- end }}
          ports:
            - containerPort: {{ .Values.mobileAuthBroker.service.port }}
              name: http
          env:
            - name: BROKER_HOSTNAME
              value: {{ .Values.mobileAuthBroker.hostname | quote }}
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "claw.mobileAuthBrokerSecretName" . }}
                  key: githubClientID
            - name: SERVER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "claw.mobileAuthBrokerSecretName" . }}
                  key: serverSecret
            - name: GATEWAY_SERVICE_URL
              value: {{ .Values.mobileAuthBroker.gatewayServiceURL | default (print "http://" (include "claw.fullname" .) ":" .Values.service.port) | quote }}
            - name: ALLOWED_EMAILS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "claw.mobileAuthBrokerAllowedEmailsConfigMapName" . }}
                  key: allowedEmails
            - name: ACCESS_TOKEN_TTL
              value: {{ .Values.mobileAuthBroker.accessTokenTTL | default "1h" | quote }}
            - name: REFRESH_TOKEN_TTL
              value: {{ .Values.mobileAuthBroker.refreshTokenTTL | default "720h" | quote }}
            - name: LISTEN_ADDR
              value: ":{{ .Values.mobileAuthBroker.service.port }}"
            - name: DATABASE_PATH
              value: "/data/broker.db"
            - name: MAX_MESSAGE_SIZE
              value: {{ .Values.mobileAuthBroker.maxMessageSize | default "16777216" | quote }}
            - name: POLL_INTERVAL_SCALE
              value: {{ .Values.mobileAuthBroker.pollIntervalScale | default "1.5" | quote }}
            {{- if .Values.mobileAuthBroker.tailnet.enabled }}
            - name: TAILNET_ENABLED
              value: "true"
            - name: TAILNET_SOCKET
              value: "/run/tailscale/tailscaled.sock"
            - name: TAILNET_IDENTITY
              value: {{ required "mobileAuthBroker.tailnet.identityScopes must have at least one entry when mobileAuthBroker.tailnet.enabled is true" (first .Values.mobileAuthBroker.tailnet.identityScopes) | quote }}
            - name: TAILNET_AUTHKEY
              value: {{ .Values.mobileAuthBroker.tailnet.authKey | quote }}
            - name: TAILNET_HOSTNAME
              value: {{ .Values.mobileAuthBroker.tailnet.hostname | quote }}
            - name: TAILNET_LOGIN_SERVER
              value: {{ .Values.mobileAuthBroker.tailnet.loginServer | quote }}
            - name: TAILNET_TUN_MODE
              value: {{ .Values.mobileAuthBroker.tailnet.tunMode | quote }}
            {{- end }}
          {{- if .Values.mobileAuthBroker.tailnet.enabled }}
          # tailscaled needs a real TUN device (NET_ADMIN/NET_RAW) and writes
          # its state/socket under /run and /var/lib -- both explicitly
          # mounted emptyDirs below, so readOnlyRootFilesystem stays off only
          # for this mode. Deliberately NOT built via `merge` on top of
          # mobileAuthBroker.containerSecurityContext: sprig/mergo treats a
          # `false` override as its zero value and silently keeps the base
          # `true`, which would defeat this override.
          securityContext:
            allowPrivilegeEscalation: {{ .Values.mobileAuthBroker.containerSecurityContext.allowPrivilegeEscalation }}
            runAsNonRoot: {{ .Values.mobileAuthBroker.containerSecurityContext.runAsNonRoot }}
            runAsUser: {{ .Values.mobileAuthBroker.containerSecurityContext.runAsUser }}
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN", "NET_RAW"]
          {{- else }}
          securityContext:
            {{- toYaml .Values.mobileAuthBroker.containerSecurityContext | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.mobileAuthBroker.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            initialDelaySeconds: {{ .Values.mobileAuthBroker.livenessProbe.initialDelaySeconds | default 30 }}
            periodSeconds: {{ .Values.mobileAuthBroker.livenessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.mobileAuthBroker.livenessProbe.timeoutSeconds | default 30 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              scheme: HTTP
            initialDelaySeconds: {{ .Values.mobileAuthBroker.readinessProbe.initialDelaySeconds | default 50 }}
            periodSeconds: {{ .Values.mobileAuthBroker.readinessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.mobileAuthBroker.readinessProbe.timeoutSeconds | default 30 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.mobileAuthBroker.tailnet.enabled }}
            - name: dev-net-tun
              mountPath: /dev/net/tun
            - name: tailscale-run
              mountPath: /run/tailscale
            - name: tailscale-state
              mountPath: /var/lib/tailscale
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.mobileAuthBroker.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "claw.mobileAuthBrokerPVCName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.mobileAuthBroker.tailnet.enabled }}
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: tailscale-run
          emptyDir: {}
        - name: tailscale-state
          emptyDir: {}
        {{- end }}
---

{{- /* Service */ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "claw.fullname" . }}-mobile-auth-broker
  labels:
    {{- include "claw.labels" . | nindent 4 }}
    app.kubernetes.io/component: mobile-auth-broker
spec:
  type: {{ .Values.mobileAuthBroker.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.mobileAuthBroker.service.port }}
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: {{ include "claw.name" . }}-mobile-auth-broker
    app.kubernetes.io/instance: {{ .Release.Name }}
---

{{- /* NetworkPolicy */ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "claw.fullname" . }}-mobile-auth-broker
  labels:
    {{- include "claw.labels" . | nindent 4 }}
    app.kubernetes.io/component: mobile-auth-broker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "claw.name" . }}-mobile-auth-broker
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Release.Name }}-cloudflared
      ports:
        - port: {{ .Values.mobileAuthBroker.service.port }}
          protocol: TCP
    {{- if .Values.mobileAuthBroker.tailnet.enabled }}
    # Direct (non-DERP-relayed) WireGuard traffic for the tailnet bypass.
    # Not required for the bypass to work -- tailscaled falls back to DERP
    # over the egress 443/TCP rule below -- but avoids always paying the
    # relay's extra hop/latency.
    - from:
        - ipBlock:
            cidr: {{ .Values.mobileAuthBroker.tailnet.cidr }}
      ports:
        - port: 41641
          protocol: UDP
    {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "claw.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
    {{- if .Values.mobileAuthBroker.tailnet.enabled }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 41641
          protocol: UDP
    {{- end }}
{{- end -}}
