{{- /*
Mobile Auth Broker templates - included when mobileAuthBroker.enabled is true
*/ -}}
{{- if .Values.mobileAuthBroker.enabled -}}

{{- /* ConfigMap for allowed emails */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "claw.mobileAuthBrokerAllowedEmailsConfigMapName" . }}
  labels:
    {{- include "claw.labels" . | nindent 4 }}
    app.kubernetes.io/component: mobile-auth-broker
data:
  allowedEmails: {{ .Values.mobileAuthBroker.allowedEmails | join "," | quote }}
---

{{- /* Secret for broker */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "claw.mobileAuthBrokerSecretName" . }}
  labels:
    {{- include "claw.labels" . | nindent 4 }}
    app.kubernetes.io/component: mobile-auth-broker
type: Opaque
{{- if not .Values.mobileAuthBroker.existingSecret }}
stringData:
  serverSecret: {{ .Values.mobileAuthBroker.serverSecret | default (randAlphaNum 64) | quote }}
  githubClientID: {{ .Values.mobileAuthBroker.githubClientID | quote }}
  {{- if and .Values.mobileAuthBroker.tls.enabled (not .Values.mobileAuthBroker.tls.existingSecret.name) }}
  cloudflareApiToken: {{ required "mobileAuthBroker.tls.cloudflareApiToken is required when mobileAuthBroker.tls.enabled is true and no existingSecret is set" .Values.mobileAuthBroker.tls.cloudflareApiToken | quote }}
  {{- end }}
{{- end }}
---

{{- /* PersistentVolumeClaim */ -}}
{{- if .Values.mobileAuthBroker.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "claw.mobileAuthBrokerPVCName" . }}
  labels:
    {{- include "claw.labels" . | nindent 4 }}
    app.kubernetes.io/component: mobile-auth-broker
spec:
  accessModes:
    {{- .Values.mobileAuthBroker.persistence.accessModes | toYaml | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.mobileAuthBroker.persistence.size | quote }}
  {{- if .Values.mobileAuthBroker.persistence.storageClass }}
  storageClassName: {{ .Values.mobileAuthBroker.persistence.storageClass | quote }}
  {{- end }}
---
{{- end }}

{{- /* Deployment */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "claw.fullname" . }}-mobile-auth-broker
  labels:
    {{- include "claw.labels" . | nindent 4 }}
    app.kubernetes.io/component: mobile-auth-broker
  annotations:
    checksum/secret: {{ print .Values.mobileAuthBroker.serverSecret .Values.mobileAuthBroker.githubClientID | sha256sum }}
    checksum/allowed-emails: {{ .Values.mobileAuthBroker.allowedEmails | join "," | sha256sum }}
spec:
  replicas: {{ .Values.mobileAuthBroker.replicaCount | default 1 }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "claw.name" . }}-mobile-auth-broker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "claw.name" . }}-mobile-auth-broker
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/component: mobile-auth-broker
      annotations:
        checksum/secret: {{ print .Values.mobileAuthBroker.serverSecret .Values.mobileAuthBroker.githubClientID | sha256sum }}
        checksum/allowed-emails: {{ .Values.mobileAuthBroker.allowedEmails | join "," | sha256sum }}
    spec:
      serviceAccountName: {{ if .Values.mobileAuthBroker.serviceAccount.create }}{{ default (include "claw.fullname" .) .Values.mobileAuthBroker.serviceAccount.name }}{{ else }}{{ required "mobileAuthBroker.serviceAccount.name must be set when serviceAccount.create is false" .Values.mobileAuthBroker.serviceAccount.name }}{{ end }}
      securityContext:
        {{- toYaml .Values.mobileAuthBroker.podSecurityContext | nindent 8 }}
      {{- with .Values.mobileAuthBroker.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mobileAuthBroker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mobileAuthBroker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mobileAuthBroker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.mobileAuthBroker.tailnet.enabled }}
      initContainers:
        # Loading a kernel module is a host-wide operation that NET_ADMIN/
        # NET_RAW alone cannot do (it needs CAP_SYS_MODULE and the host's
        # /lib/modules) -- mirrors the cloudflared subchart's own
        # enable-ip-forward init container for the same reason. Runs once,
        # privileged, before the unprivileged main container starts; "|| true"
        # on modprobe because a kernel with TUN built in (not as a loadable
        # module) can make modprobe itself report not-found while the device
        # still works, so the real check is the `test -c` that follows.
        #
        # Also chowns the tailscale-run emptyDir (the tailscaled.sock
        # directory) to the main container's UID: kubelet creates emptyDir
        # volumes owned by root, and podSecurityContext.fsGroup only ever
        # adds group write access, never changes the owning UID. tailscaled's
        # state directory itself doesn't need this anymore -- it now lives
        # under /data (the broker's persistent volume, see scripts/ciron.toml),
        # which tailscaled creates itself as its own UID on first run. Before
        # that move, tailscaled's own store.New `chmod` on its (root-owned
        # emptyDir) state directory at startup failed requiring UID
        # *ownership*, not just group-writability -- confirmed live:
        # "store.New failed: creating state directory: chmod
        # /var/lib/tailscale: operation not permitted; starting with
        # in-memory store with a health warning", after which tailscaled
        # permanently refused `tailscale up` with "cannot start backend when
        # state store is unhealthy" for the rest of that process's life.
        # `privileged: true` alone does NOT hand this container's process
        # CAP_CHOWN/CAP_SYS_MODULE unless it also runs as UID 0: confirmed
        # live via /proc/self/status -- privileged-but-non-root put every
        # requested capability in CapBnd (the ceiling) while CapPrm/CapEff
        # stayed all-zero, and chown failed with EPERM. Only UID 0 gets the
        # kernel's automatic bounding-set-becomes-effective promotion (the
        # same reason tailscaled itself needed file capabilities via setcap
        # instead, since that binary runs as the main container's non-root
        # UID). This container is privileged and root only for this one
        # setup step, before the unprivileged, non-root main container
        # starts.
        - name: load-tun-module
          image: "{{ .Values.mobileAuthBroker.image.repository }}:{{ .Values.mobileAuthBroker.image.tag }}"
          imagePullPolicy: {{ .Values.mobileAuthBroker.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            privileged: true
            runAsUser: 0
            runAsNonRoot: false
          command:
            - sh
            - -c
            - |
              modprobe tun || echo "modprobe tun failed (kernel may already have it built in)"
              if [ ! -c /dev/net/tun ]; then
                echo "ERROR: /dev/net/tun still not a char device after modprobe -- this node cannot give the tailnet bypass a real TUN device" >&2
                exit 1
              fi
              chown -R {{ .Values.mobileAuthBroker.containerSecurityContext.runAsUser }} /run/tailscale
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
            - name: tailscale-run
              mountPath: /run/tailscale
      {{- end }}
      containers:
        - name: mobile-auth-broker
          image: "{{ .Values.mobileAuthBroker.image.repository }}:{{ .Values.mobileAuthBroker.image.tag }}"
          imagePullPolicy: {{ .Values.mobileAuthBroker.image.pullPolicy | default "IfNotPresent" }}
          {{- if not .Values.mobileAuthBroker.tailnet.enabled }}
          # The image's default entrypoint is cirond, supervising the broker
          # plus tailscaled/tailscale (see scripts/ciron.toml). Without the
          # tailnet bypass there is nothing for cirond to supervise beyond
          # the broker itself, so run it directly instead.
          command: ["/app/mobile-auth-broker"]
          {{- end }}
          ports:
            - containerPort: {{ .Values.mobileAuthBroker.service.port }}
              name: http
            {{- range $i, $port := .Values.mobileAuthBroker.extraListenPorts }}
            - containerPort: {{ $port }}
              name: http-extra-{{ $i }}
            {{- end }}
            {{- if .Values.mobileAuthBroker.tls.enabled }}
            {{- range $i, $port := .Values.mobileAuthBroker.tls.ports }}
            - containerPort: {{ $port }}
              name: https-{{ $i }}
            {{- end }}
            {{- end }}
          env:
            - name: BROKER_HOSTNAME
              value: {{ .Values.mobileAuthBroker.hostname | quote }}
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "claw.mobileAuthBrokerSecretName" . }}
                  key: githubClientID
            - name: SERVER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "claw.mobileAuthBrokerSecretName" . }}
                  key: serverSecret
            - name: GATEWAY_SERVICE_URL
              value: {{ .Values.mobileAuthBroker.gatewayServiceURL | default (print "http://" (include "claw.fullname" .) ":" .Values.service.port) | quote }}
            - name: ALLOWED_EMAILS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "claw.mobileAuthBrokerAllowedEmailsConfigMapName" . }}
                  key: allowedEmails
            - name: ACCESS_TOKEN_TTL
              value: {{ .Values.mobileAuthBroker.accessTokenTTL | default "1h" | quote }}
            - name: REFRESH_TOKEN_TTL
              value: {{ .Values.mobileAuthBroker.refreshTokenTTL | default "720h" | quote }}
            - name: LISTEN_ADDR
              value: ":{{ .Values.mobileAuthBroker.service.port }}"
            {{- if .Values.mobileAuthBroker.extraListenPorts }}
            - name: LISTEN_PORTS
              value: {{ prepend .Values.mobileAuthBroker.extraListenPorts .Values.mobileAuthBroker.service.port | join "," | quote }}
            {{- end }}
            - name: DATABASE_PATH
              value: "/data/broker.db"
            - name: MAX_MESSAGE_SIZE
              value: {{ .Values.mobileAuthBroker.maxMessageSize | default "16777216" | quote }}
            - name: POLL_INTERVAL_SCALE
              value: {{ .Values.mobileAuthBroker.pollIntervalScale | default "1.5" | quote }}
            {{- if .Values.mobileAuthBroker.tailnet.enabled }}
            - name: TAILNET_ENABLED
              value: "true"
            - name: TAILNET_SOCKET
              value: "/run/tailscale/tailscaled.sock"
            - name: TAILNET_IDENTITY
              value: {{ required "mobileAuthBroker.tailnet.identityScopes must have at least one entry when mobileAuthBroker.tailnet.enabled is true" (first .Values.mobileAuthBroker.tailnet.identityScopes) | quote }}
            - name: TAILNET_AUTHKEY
              value: {{ .Values.mobileAuthBroker.tailnet.authKey | quote }}
            - name: TAILNET_HOSTNAME
              value: {{ .Values.mobileAuthBroker.tailnet.hostname | quote }}
            - name: TAILNET_LOGIN_SERVER
              value: {{ .Values.mobileAuthBroker.tailnet.loginServer | quote }}
            - name: TAILNET_TUN_MODE
              value: {{ .Values.mobileAuthBroker.tailnet.tunMode | quote }}
            {{- end }}
            {{- if .Values.mobileAuthBroker.tls.enabled }}
            - name: TLS_ENABLED
              value: "true"
            - name: TLS_PORTS
              value: {{ .Values.mobileAuthBroker.tls.ports | join "," | quote }}
            - name: TLS_DOMAIN
              value: {{ required "mobileAuthBroker.tls.domain is required when mobileAuthBroker.tls.enabled is true" .Values.mobileAuthBroker.tls.domain | quote }}
            - name: TLS_ACME_EMAIL
              value: {{ required "mobileAuthBroker.tls.acmeEmail is required when mobileAuthBroker.tls.enabled is true" .Values.mobileAuthBroker.tls.acmeEmail | quote }}
            - name: TLS_CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  {{- if .Values.mobileAuthBroker.tls.existingSecret.name }}
                  name: {{ .Values.mobileAuthBroker.tls.existingSecret.name }}
                  key: {{ .Values.mobileAuthBroker.tls.existingSecret.key | default "cloudflareApiToken" }}
                  {{- else }}
                  name: {{ include "claw.mobileAuthBrokerSecretName" . }}
                  key: cloudflareApiToken
                  {{- end }}
            - name: TLS_CERT_CACHE_DIR
              value: {{ .Values.mobileAuthBroker.tls.certCacheDir | quote }}
            - name: TLS_ACME_STAGING
              value: {{ .Values.mobileAuthBroker.tls.acmeStaging | quote }}
            {{- end }}
          {{- /*
          The image bakes cap_net_bind_service onto /app/mobile-auth-broker
          UNCONDITIONALLY (Dockerfile `setcap`, needed for the TLS branch's
          port 443 -- see internal/tlscert) -- every build of this image
          carries it, regardless of whether this particular deployment ever
          enables TLS. A capability-bearing binary can only be exec'd by a
          process whose own bounding set already contains that capability;
          otherwise the kernel refuses the exec outright with EPERM, before
          the program even starts (confirmed live: "exec
          /app/mobile-auth-broker: operation not permitted", reproduced with
          plain `docker run --cap-drop ALL`, i.e. this broke every
          deployment of this image, not just tailnet/TLS ones). So
          NET_BIND_SERVICE must be granted here unconditionally too, or the
          container cannot start at all.
          */}}
          {{- if .Values.mobileAuthBroker.tailnet.enabled }}
          # tailscaled needs a real TUN device and writes its state/socket
          # under /run and /var/lib -- both explicitly mounted emptyDirs
          # below, so readOnlyRootFilesystem stays off only for this mode.
          # Deliberately NOT built via `merge` on top of
          # mobileAuthBroker.containerSecurityContext: sprig/mergo treats a
          # `false` override as its zero value and silently keeps the base
          # `true`, which would defeat this override.
          #
          # allowPrivilegeEscalation MUST be true here, despite the non-root
          # UID: securityContext.capabilities.add only reaches this process's
          # BOUNDING capability set, not its effective set (confirmed live --
          # /proc/1/status showed CapBnd with NET_ADMIN/NET_RAW but CapEff
          # all zero, and tailscaled's TUNSETIFF failed with EPERM as a
          # result). The Dockerfile sets file capabilities directly on the
          # tailscaled binary (`setcap cap_net_admin,cap_net_raw+eip`) as the
          # fix -- pulling them from the bounding set into the process's
          # effective set on exec -- but the kernel only honors file
          # capabilities on exec when PR_SET_NO_NEW_PRIVS is unset, which is
          # exactly what allowPrivilegeEscalation: false requests.
          securityContext:
            allowPrivilegeEscalation: true
            runAsNonRoot: {{ .Values.mobileAuthBroker.containerSecurityContext.runAsNonRoot }}
            runAsUser: {{ .Values.mobileAuthBroker.containerSecurityContext.runAsUser }}
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN", "NET_RAW", "NET_BIND_SERVICE"]
          {{- else }}
          securityContext:
            allowPrivilegeEscalation: true
            runAsNonRoot: {{ .Values.mobileAuthBroker.containerSecurityContext.runAsNonRoot }}
            runAsUser: {{ .Values.mobileAuthBroker.containerSecurityContext.runAsUser }}
            readOnlyRootFilesystem: {{ .Values.mobileAuthBroker.containerSecurityContext.readOnlyRootFilesystem }}
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          {{- end }}
          resources:
            {{- toYaml .Values.mobileAuthBroker.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            initialDelaySeconds: {{ .Values.mobileAuthBroker.livenessProbe.initialDelaySeconds | default 30 }}
            periodSeconds: {{ .Values.mobileAuthBroker.livenessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.mobileAuthBroker.livenessProbe.timeoutSeconds | default 30 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              scheme: HTTP
            initialDelaySeconds: {{ .Values.mobileAuthBroker.readinessProbe.initialDelaySeconds | default 50 }}
            periodSeconds: {{ .Values.mobileAuthBroker.readinessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.mobileAuthBroker.readinessProbe.timeoutSeconds | default 30 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.mobileAuthBroker.tailnet.enabled }}
            - name: dev-net-tun
              mountPath: /dev/net/tun
            - name: tailscale-run
              mountPath: /run/tailscale
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.mobileAuthBroker.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "claw.mobileAuthBrokerPVCName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.mobileAuthBroker.tailnet.enabled }}
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        # tailscaled's actual state (node/machine keys, etc.) now lives
        # under /data (the "data" volume above, already mounted) -- see
        # scripts/ciron.toml. This is just its ephemeral control socket
        # directory, fine to lose on every restart.
        - name: tailscale-run
          emptyDir: {}
        {{- end }}
---

{{- /* Service */ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "claw.fullname" . }}-mobile-auth-broker
  labels:
    {{- include "claw.labels" . | nindent 4 }}
    app.kubernetes.io/component: mobile-auth-broker
spec:
  type: {{ .Values.mobileAuthBroker.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.mobileAuthBroker.service.port }}
      targetPort: http
      name: http
    {{- range $i, $port := .Values.mobileAuthBroker.extraListenPorts }}
    - port: {{ $port }}
      targetPort: http-extra-{{ $i }}
      name: http-extra-{{ $i }}
    {{- end }}
    {{- if .Values.mobileAuthBroker.tls.enabled }}
    {{- range $i, $port := .Values.mobileAuthBroker.tls.ports }}
    - port: {{ $port }}
      targetPort: https-{{ $i }}
      name: https-{{ $i }}
    {{- end }}
    {{- end }}
  selector:
    app.kubernetes.io/name: {{ include "claw.name" . }}-mobile-auth-broker
    app.kubernetes.io/instance: {{ .Release.Name }}
---

{{- /* NetworkPolicy */ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "claw.fullname" . }}-mobile-auth-broker
  labels:
    {{- include "claw.labels" . | nindent 4 }}
    app.kubernetes.io/component: mobile-auth-broker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "claw.name" . }}-mobile-auth-broker
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Release.Name }}-cloudflared
      ports:
        - port: {{ .Values.mobileAuthBroker.service.port }}
          protocol: TCP
    {{- if .Values.mobileAuthBroker.tailnet.enabled }}
    # Direct (non-DERP-relayed) WireGuard traffic for the tailnet bypass.
    # Not required for the bypass to work -- tailscaled falls back to DERP
    # over the egress 443/TCP rule below -- but avoids always paying the
    # relay's extra hop/latency.
    - from:
        - ipBlock:
            cidr: {{ .Values.mobileAuthBroker.tailnet.cidr }}
      ports:
        - port: 41641
          protocol: UDP
    {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "claw.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
    {{- if .Values.mobileAuthBroker.tailnet.enabled }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 41641
          protocol: UDP
    {{- end }}
    {{- if .Values.mobileAuthBroker.tls.enabled }}
    # internal/tlscert's DNS-01 propagation check queries public resolvers
    # (Cloudflare's own 1.1.1.1/1.0.0.1, see tlscert.go) directly by design --
    # the in-cluster CoreDNS the "namespaceSelector: {}" rule above allows has
    # no particular reason to see a record just created on Cloudflare's
    # authoritative servers promptly. UDP first, TCP fallback for truncated
    # responses (large SOA/NS answers).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- end }}
{{- end -}}
