apiVersion: v1
kind: Secret
metadata:
  name: {{ include "claw.mobileAuthBrokerSecretName" . }}
  labels:
    {{- include "claw.labels" . | nindent 4 }}
    app.kubernetes.io/component: mobile-auth-broker
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  serverSecret: {{ .Values.mobileAuthBroker.serverSecret | default (randAlphaNum 64) | quote }}
  githubClientID: {{ .Values.mobileAuthBroker.githubClientID | default "" | quote }}
