apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "claw.fullname" . }}-mobile-auth-broker
  labels:
    {{- include "claw.labels" . | nindent 4 }}
    app.kubernetes.io/component: mobile-auth-broker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "claw.name" . }}-mobile-auth-broker
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: {{ .Release.Namespace | default "default" }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "claw.name" . }}-cloudflared
      ports:
        - port: {{ .Values.mobileAuthBroker.service.port }}
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "claw.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
