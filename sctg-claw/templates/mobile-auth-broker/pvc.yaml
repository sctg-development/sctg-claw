apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "claw.mobileAuthBrokerPVCName" . }}
  labels:
    {{- include "claw.labels" . | nindent 4 }}
    app.kubernetes.io/component: mobile-auth-broker
spec:
  accessModes:
    {{- .Values.mobileAuthBroker.persistence.accessModes | toYaml | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.mobileAuthBroker.persistence.size | default "1Gi" | quote }}
  {{- if .Values.mobileAuthBroker.persistence.storageClass }}
  storageClassName: {{ .Values.mobileAuthBroker.persistence.storageClass | quote }}
  {{- end }}
